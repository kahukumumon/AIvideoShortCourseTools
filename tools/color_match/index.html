<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画色合わせ | AI動画短期講座ツール</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="topbar-link" href="../..">一覧へ戻る</a>
      <nav class="topbar-nav" aria-label="ツール移動" data-tool-nav></nav>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div>
          <span class="eyebrow">VIDEO COLOR MATCH</span>
          <h1>動画色合わせ</h1>
          <p>
            ドロップした動画の 0 フレーム目を基準色として、各フレームに MKL 色合わせを適用し、
            音声を保った mp4 として書き出します。
          </p>
        </div>
        <p class="hint">処理はブラウザ内で完結します。長い動画や高解像度では時間がかかります。</p>
      </div>

      <div class="warning" id="protocolWarning" hidden>
        <code>file://</code> で開くと CDN や ffmpeg 読み込みに制限が出る場合があります。必要ならローカルサーバー経由で開いてください。
      </div>

      <div class="grid">
        <div class="subpanel">
          <h3>入力と書き出し</h3>
          <label class="dropzone" id="colorMatchDrop">
            <input id="colorMatchInput" type="file" accept="video/*" multiple>
            <span>
              <strong>動画をドラッグ＆ドロップ</strong>
              複数選択にも対応 / 各動画の 0 フレーム目を基準にします
            </span>
          </label>

          <div class="file-list" id="colorMatchFileList" hidden></div>

          <div class="controls">
            <button class="primary" id="colorMatchRun" disabled>全部MKL色合わせしてmp4保存</button>
            <button class="danger" id="colorMatchCancel" disabled>処理をキャンセル</button>
            <button class="secondary" id="colorMatchClear">クリア</button>
          </div>

          <div class="progress-shell" aria-hidden="true">
            <div class="progress-bar" id="colorMatchProgress"></div>
          </div>
          <div class="status-row">
            <div class="status-card" id="colorMatchStatus">
              <div class="status-text">動画を追加するとここに状態を表示します。</div>
            </div>
          </div>

          <div class="video-frame" id="colorMatchPreviewWrap" hidden>
            <video id="colorMatchPreview" controls playsinline muted></video>
          </div>
        </div>

        <div class="subpanel">
          <h3>処理ログ</h3>
          <div class="log" id="colorMatchLog">動画色合わせログ待機中</div>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
  <script src="../../assets/js/tool-nav.js"></script>
</body>
</html>
